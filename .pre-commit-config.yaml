repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe]
        exclude: ^charts/
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: detect-private-key
        exclude: ^packages/naas/tests/unit/test_selfsigned\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: [types-redis, types-PyYAML, types-paramiko, types-requests]
        exclude: ^packages/naas/tests/integration/

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: [--fix]
        exclude: ^packages/naas/changes/

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: export-openapi-spec
        name: Export OpenAPI spec
        language: system
        entry: bash -c 'cd packages/naas && uv run invoke export-spec && git add ../../docs/swagger/openapi.json'
        pass_filenames: false
        files: ^(packages/naas/naas/|docs/swagger/openapi\.json)
