name: Build and K8s Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, 'release/**']

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'packages/naas/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'k8s/**'
              - '.github/workflows/build.yml'

  build:
    name: Build
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/naas/Dockerfile
          push: false
          tags: naas:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test Docker image
        run: |
          docker run --rm naas:test python -c "import naas; print('Import successful')"

      - name: Save image as artifact
        run: |
          docker save naas:test | gzip > naas-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: naas-docker-image
          path: naas-image.tar.gz
          retention-days: 1

  k8s-changes:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            k8s:
              - 'k8s/**'
              - 'charts/**'
              - 'packages/naas/Dockerfile'
              - 'packages/naas/tests/k8s/**'
              - '.github/workflows/build.yml'

  helm-lint:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint charts/naas
      - name: Template dry-run
        run: helm template test charts/naas --set secrets.redisPassword=ci-test

  k8s-tests:
    runs-on: ubuntu-latest
    needs: [build, k8s-changes]
    if: |
      needs.k8s-changes.outputs.changed == 'true' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --package naas --extra dev --package naas-client

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Create k3d cluster
        run: k3d cluster create naas-test --wait

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: naas-docker-image

      - name: Load image into k3d
        run: |
          docker load < naas-image.tar.gz
          k3d image import naas:test -c naas-test

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy NAAS via Helm chart
        run: |
          helm install naas charts/naas \
            --namespace naas --create-namespace \
            --set image.repository=naas \
            --set image.tag=test \
            --set image.pullPolicy=Never \
            --set secrets.redisPassword=test-redis-pw \
            --set secrets.encryptionKey=IaypjfWWRlCStgKgneWQDfteGYNdO70FSepbfHdC6yY= \
            --set api.replicas=1 \
            --set worker.replicas=1
          # cisshgo is a test fixture, not part of the chart
          kubectl apply -f k8s/cisshgo/

      - name: Wait for rollouts
        run: |
          kubectl -n naas rollout status deployment/redis --timeout=60s
          kubectl -n naas rollout status deployment/naas-api --timeout=90s || {
            echo "API deployment failed, debugging..."
            kubectl -n naas get pods
            kubectl -n naas describe deployment naas-api
            kubectl -n naas logs -l app=naas-api --tail=50
            exit 1
          }
          kubectl -n naas rollout status deployment/naas-worker --timeout=90s || {
            echo "Worker deployment failed, debugging..."
            kubectl -n naas get pods
            kubectl -n naas describe deployment naas-worker
            kubectl -n naas logs -l app=naas-worker --tail=50
            exit 1
          }
          kubectl -n naas rollout status deployment/cisshgo --timeout=60s

      - name: Smoke test healthcheck
        run: |
          kubectl -n naas port-forward svc/naas-api 8443:443 &
          sleep 3
          curl -k -f https://localhost:8443/healthcheck

      - name: Run end-to-end job test
        run: |
          CISSHGO_IP=$(kubectl -n naas get svc cisshgo -o jsonpath='{.spec.clusterIP}')
          NAAS_URL=https://localhost:8443 CISSHGO_HOST=${CISSHGO_IP} uv run --package naas python packages/naas/tests/k8s/test_e2e.py

      - name: Cleanup
        if: always()
        run: k3d cluster delete naas-test

  build-and-k8s-summary:
    name: Build and K8s Tests
    runs-on: ubuntu-latest
    needs: [changes, build, k8s-tests, helm-lint]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.changes.outputs.code }}" != "true" ]]; then
            echo "No code changes — build and k8s tests skipped"
            exit 0
          fi
          if [[ "${{ needs.build.result }}" == "failure" || "${{ needs.build.result }}" == "cancelled" ]]; then
            echo "Build failed or was cancelled"
            exit 1
          fi
          if [[ "${{ needs.k8s-tests.result }}" == "failure" || "${{ needs.k8s-tests.result }}" == "cancelled" ]]; then
            echo "K8s tests failed or were cancelled"
            exit 1
          fi
          if [[ "${{ needs.helm-lint.result }}" == "failure" || "${{ needs.helm-lint.result }}" == "cancelled" ]]; then
            echo "Helm lint failed or was cancelled"
            exit 1
          fi
          # skipped is acceptable for k8s-tests (path filter didn't match)
