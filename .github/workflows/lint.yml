name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, 'release/**']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --package naas --extra dev

      - name: Run ruff linter
        run: uv run ruff check --config packages/naas/pyproject.toml packages/naas/naas/ packages/naas/tests/

      - name: Check ruff formatting
        run: uv run ruff format --check --config packages/naas/pyproject.toml packages/naas/naas/ packages/naas/tests/

      - name: Run mypy
        run: uv run mypy --config-file packages/naas/pyproject.toml packages/naas/naas/

  check-changelog:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Check for news fragment
        run: |
          # Skip check for sync PRs from main to develop
          if [[ "${{ github.base_ref }}" == "develop" && "${{ github.head_ref }}" == "main" ]]; then
            echo "✅ Skipping changelog check for sync PR from main to develop"
            exit 0
          fi

          # Skip check for release-branch PRs into main. The release commit
          # on release/X.Y runs `towncrier build --yes` which consumes all
          # fragments and deletes them, so by the time the release/X.Y → main
          # PR is opened, packages/naas/changes/ is intentionally empty.
          if [[ "${{ github.base_ref }}" == "main" && "${{ github.head_ref }}" =~ ^release/[0-9]+\.[0-9]+$ ]]; then
            echo "✅ Skipping changelog check for release-branch PR into main (fragments already consumed by towncrier build)"
            exit 0
          fi

          # Check if any changelog fragment exists (issue number or + prefix)
          if ! ls packages/naas/changes/*.*.md 1> /dev/null 2>&1; then
            echo "❌ Error: No changelog fragment found"
            echo ""
            echo "Create one with:"
            echo "  towncrier create <issue#>.<type>.md --content 'Your description'"
            echo ""
            echo "Or for work without an issue:"
            echo "  towncrier create +description.<type>.md --content 'Your description'"
            echo ""
            echo "Available types:"
            echo "  feature      - New features"
            echo "  bugfix       - Bug fixes"
            echo "  security     - Security improvements"
            echo "  breaking     - Breaking changes"
            echo "  deprecation  - Deprecations"
            echo "  doc          - Documentation"
            echo "  testing      - Testing/CI improvements"
            echo "  internal     - Internal changes (not shown to users)"
            exit 1
          fi

          echo "✅ Found changelog fragment(s)"

  lint-summary:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: [lint, check-changelog]
    if: always()
    steps:
      - name: Check lint results
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" || "${{ needs.lint.result }}" == "cancelled" ]]; then
            echo "Lint failed or was cancelled"
            exit 1
          fi
          if [[ "${{ needs.check-changelog.result }}" == "failure" || "${{ needs.check-changelog.result }}" == "cancelled" ]]; then
            echo "Changelog check failed or was cancelled"
            exit 1
          fi
