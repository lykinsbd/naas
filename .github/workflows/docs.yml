name: Documentation

on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'naas/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'changes/**'
      - '.markdownlint.json'
      - '.vale.ini'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'naas/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'changes/**'
      - '.markdownlint.json'
      - '.vale.ini'

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run markdownlint
        # Pinned to a specific minor version (rather than the @v23 major-floating
        # convention used elsewhere) because this action's behavior is gated by
        # the bundled markdownlint engine, which introduces new lint rules in
        # minor releases. v23.1.0 enabled MD060 by default and broke the v2.1.0
        # release PR. See #472, #461, #462.
        uses: DavidAnson/markdownlint-cli2-action@v24.1.0
        with:
          globs: |
            README.md
            CONTRIBUTING.md
            docs/**/*.md

  prose-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: errata-ai/vale-action@v2
        with:
          files: '["README.md", "CONTRIBUTING.md", "docs/quickstart.md", "docs/api-usage.md", "docs/troubleshooting.md", "docs/security.md"]'
          # Pin to match .mise.toml so CI and local dev agree on the Vale version.
          version: "3.12.0"

  prose-lint-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: errata-ai/vale-action@v2
        with:
          files: '["changes", "CHANGELOG.md"]'
          # Pin to match .mise.toml so CI and local dev agree on the Vale version.
          version: "3.12.0"
          fail_on_error: false
        continue-on-error: true

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check links in markdown files
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.markdown-link-check.json'
          exclude-file: 'docs/adr/template.md'

  check-openapi-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --package naas --extra dev

      - name: Export OpenAPI spec
        run: cd packages/naas && uv run invoke export-spec

      - name: Fail if spec is out of date
        run: git diff --exit-code docs/swagger/openapi.json

  check-client-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --package naas-client --extra dev

      - name: Regenerate client models
        run: uv run --package naas-client python packages/naas-client/scripts/generate_models.py

      - name: Fail if generated models are out of date
        run: git diff --exit-code packages/naas-client/naas_client/_generated.py
