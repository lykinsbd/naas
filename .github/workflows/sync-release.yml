name: Sync Release to Develop

# Runs after a final release tag is pushed (vX.Y.Z, no b/rc suffix).
# Two jobs:
#   1. sync-to-develop: open a PR to bring main → develop with the
#      newly-released commits.
#   2. bump-develop: open a PR to bump develop's version to the next
#      minor's alpha — only for X.Y.0 releases, NOT for patch releases
#      (X.Y.Z, Z > 0). Patch releases don't change the develop minor
#      stream and don't need a develop bump.
#
# Note: there is no longer a sync-to-release-branch job. Under the new
# release model (ADR 0011), release/X.Y is the source of truth during
# a release and the merge of release/X.Y → main is a merge-commit, so
# the tag SHA is reachable from main without any further sync work.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-to-develop:
    runs-on: ubuntu-latest
    # Only run for final releases (vX.Y.Z, not vX.Y.ZbN or vX.Y.ZrcN).
    if: "!contains(github.ref_name, 'b') && !contains(github.ref_name, 'rc')"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Create PR to develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Skip if a main → develop sync PR is already open.
          EXISTING_PR=$(gh pr list --base develop --head main --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists, skipping"
            exit 0
          fi

          gh pr create \
            --base develop \
            --head main \
            --title "chore: sync v${VERSION} release back to develop" \
            --body "Automated PR to sync release v${VERSION} from main back to develop."

  bump-develop:
    runs-on: ubuntu-latest
    needs: sync-to-develop
    # Only run for new minor releases (X.Y.0). Patch releases (X.Y.Z, Z > 0)
    # don't change the develop minor stream — develop is already at the
    # next minor's alpha and shouldn't be re-bumped.
    if: |
      !contains(github.ref_name, 'b') &&
      !contains(github.ref_name, 'rc') &&
      endsWith(github.ref_name, '.0')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Bump develop to next alpha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Calculate next minor: 1.3.0 → 1.4.0a1
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          NEXT_MINOR=$((MINOR + 1))
          NEXT_VERSION="${MAJOR}.${NEXT_MINOR}.0a1"
          BRANCH="chore/bump-develop-v${NEXT_VERSION}"

          git checkout -b "$BRANCH"
          sed -i "s/^version = \".*\"/version = \"${NEXT_VERSION}\"/" packages/naas/pyproject.toml
          uv lock

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/naas/pyproject.toml uv.lock
          git commit -m "chore: bump develop to v${NEXT_VERSION}"
          git push -u origin "$BRANCH"

          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore: bump develop to v${NEXT_VERSION}" \
            --body "Automated version bump after v${VERSION} release."
