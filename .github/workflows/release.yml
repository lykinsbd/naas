name: Release

# Tag-driven: this workflow only runs when a release tag is pushed.
# Tags are created by `inv release-bump VERSION` on a release/X.Y branch
# (see ADR 0011). CI never creates tags or commits to branches.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
    steps:
      - name: Parse and validate tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Tag must look like vX.Y.Z, vX.Y.ZbN, or vX.Y.ZrcN.
          # Alphas (vX.Y.ZaN) are explicitly rejected — those live only on
          # develop and never get released.
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)((b|rc)([0-9]+))?$ ]]; then
            echo "::error::Tag '$TAG' is not a valid release version. Allowed shapes: vX.Y.Z, vX.Y.ZbN, vX.Y.ZrcN."
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Pre-release if the tag has a b/rc suffix.
          if [[ -n "${BASH_REMATCH[2]}" ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "✅ Pre-release tag: $TAG (version $VERSION)"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "✅ Final release tag: $TAG (version $VERSION)"
          fi

      - uses: actions/checkout@v7
        with:
          # Check out the tagged commit. fetch-depth: 0 so towncrier can
          # render unconsumed fragments for prerelease bodies.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --package naas --extra dev

      - name: Build release notes
        id: notes
        run: |
          VERSION="${{ steps.parse.outputs.version }}"
          IS_PRERELEASE="${{ steps.parse.outputs.is_prerelease }}"

          if [[ "$IS_PRERELEASE" == "false" ]]; then
            # Final release: extract the just-added section from CHANGELOG.md.
            # `inv release-bump` ran towncrier locally before tagging, so
            # CHANGELOG.md already has the X.Y.Z section.
            awk -v ver="$VERSION" '
              $0 ~ "^# NAAS " ver " " { found=1 }
              found && /^# / && $0 !~ "^# NAAS " ver " " { exit }
              found { print }
            ' CHANGELOG.md > .release-notes.md
            if [ ! -s .release-notes.md ]; then
              echo "::error::Could not find a # NAAS $VERSION section in CHANGELOG.md."
              echo "::error::Did `inv release-bump` run towncrier before tagging?"
              exit 1
            fi
          else
            # Pre-release: render unconsumed fragments in-memory via
            # `towncrier build --draft`. No file changes.
            uv run towncrier build --draft --version "$VERSION" --dir packages/naas \
              > .release-notes.md
            if [ ! -s .release-notes.md ]; then
              echo "::error::towncrier --draft produced no output for $VERSION."
              echo "::error::Are there any fragments in packages/naas/changes/?"
              exit 1
            fi

            # Prepend the standard prerelease warning banner.
            if [[ "$VERSION" =~ rc[0-9]+$ ]]; then
              cat > .release-notes-final.md <<'BANNER'
          # 🚀 Release Candidate

          **This is a release candidate for testing and validation.**

          This release is feature-complete and should be stable. Only critical bug fixes will be accepted before the final release.

          Please test thoroughly and report any issues.

          ---

          BANNER
            else
              cat > .release-notes-final.md <<'BANNER'
          # ⚠️ BETA SOFTWARE ⚠️

          **This is beta software and should not be used in production.**

          This release is feature-complete but undergoing testing. APIs may still change, and bugs are expected.

          ---

          BANNER
            fi
            cat .release-notes.md >> .release-notes-final.md
            mv .release-notes-final.md .release-notes.md
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Generate API client artifacts
        run: |
          VERSION="${{ steps.parse.outputs.version }}"
          # Generate Postman collection from the OpenAPI spec at the tagged SHA.
          npx --yes openapi-to-postmanv2 \
            -s docs/swagger/openapi.json \
            -o "naas-v${VERSION}.postman_collection.json"
          # Copy the OpenAPI spec with a versioned filename.
          cp docs/swagger/openapi.json "naas-v${VERSION}.openapi.json"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: .release-notes.md
          draft: false
          prerelease: ${{ steps.parse.outputs.is_prerelease }}
          files: |
            naas-v${{ steps.parse.outputs.version }}.postman_collection.json
            naas-v${{ steps.parse.outputs.version }}.openapi.json
