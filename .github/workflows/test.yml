name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, 'release/**']

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'packages/naas/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/test.yml'

  unit-tests:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --package naas --extra dev

      - name: Run unit tests with coverage
        run: uv run --package naas pytest packages/naas/tests/unit -v --cov=naas --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        if: always()
        with:
          files: ./coverage.xml
          flags: unit
          name: unit-tests-${{ matrix.python-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  integration-tests:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --package naas --extra dev --extra vault --extra aws --package naas-client

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run integration tests
        run: uv run --package naas pytest packages/naas/tests/integration -v --tb=short --no-cov

      - name: Cleanup Docker
        if: always()
        run: docker compose -f packages/naas/tests/integration/docker-compose.test.yml down -v

  contract-tests:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --package naas --extra dev

      - name: Run contract tests
        run: uv run --package naas pytest packages/naas/tests/contract -v --tb=short --no-cov

  tests-summary:
    name: Tests
    runs-on: ubuntu-latest
    needs: [changes, unit-tests, integration-tests, contract-tests]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.changes.outputs.code }}" != "true" ]]; then
            echo "No code changes — tests skipped"
            exit 0
          fi
          if [[ "${{ needs.unit-tests.result }}" == "failure" || "${{ needs.unit-tests.result }}" == "cancelled" ]]; then
            echo "Unit tests failed or were cancelled"
            exit 1
          fi
          if [[ "${{ needs.integration-tests.result }}" == "failure" || "${{ needs.integration-tests.result }}" == "cancelled" ]]; then
            echo "Integration tests failed or were cancelled"
            exit 1
          fi
          if [[ "${{ needs.contract-tests.result }}" == "failure" || "${{ needs.contract-tests.result }}" == "cancelled" ]]; then
            echo "Contract tests failed or were cancelled"
            exit 1
          fi
