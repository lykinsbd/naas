site_name: NAAS Documentation
site_description: Netmiko As A Service - REST API for network device automation
site_url: https://naas.readthedocs.io
repo_url: https://github.com/lykinsbd/naas
repo_name: lykinsbd/naas
docs_dir: docs
site_dir: site

extra:
  swagger_ui_version: 5.10.0

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - swagger-ui-tag
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: quickstart.md
      - Installation: installation.md
      - Architecture: architecture.md
  - User Guide:
      - API Usage: api-usage.md
      - Python Client: client.md
      - Structured Output: structured-output.md
      - Context Routing: contexts.md
      - Observability: observability.md
      - Reliability: reliability.md
      - Security: security.md
      - Troubleshooting: troubleshooting.md
      - Upgrading to v2.0: upgrading.md
  - Deployment:
      - Docker Compose: deployment/docker-compose.md
      - Kubernetes: kubernetes.md
      - Environment Variables: deployment/environment-variables.md
  - Development:
      - Contributing: contributing.md
      - Development Guide: development.md
      - Testing: testing.md
  - Reference:
      - API Reference: api-reference.md
      - Error Codes: error-codes.md
      - Architecture Decisions:
          - ADR Index: adr/README.md
          - "0001: Python Client Integration": adr/0001-python-client-library-integration.md
          - "0002: Secrets Backend Abstraction": adr/0002-secrets-backend-abstraction.md
          - "0003: API Key Authentication": adr/0003-api-key-authentication.md
          - "0004: Role-Based Access Control": adr/0004-role-based-access-control.md
          - "0005: Structured Audit Logging": adr/0005-structured-audit-event-logging.md
          - "0006: Credential Encryption at Rest": adr/0006-credential-encryption-at-rest.md
          - "0007: API Versioning Strategy": adr/0007-api-versioning-strategy.md
          - "0008: OpenTelemetry Instrumentation": adr/0008-opentelemetry-instrumentation-strategy.md
          - "0009: Command Authorization Deferred to AAA": adr/0009-command-authorization-deferred-to-aaa.md
      - Changelog: changelog.md
      - Release Notes:
          - v2.0: release-notes/v2.0.md
          - v1.4: release-notes/v1.4.md
          - v1.3: release-notes/v1.3.md
          - v1.2: release-notes/v1.2.md
          - v1.1: release-notes/v1.1.md
